
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#d8f8e9">
  <meta name="description" content="Open Game: juega gratis a juegos HTML5 en tu navegador.">
  <title>Open Game — Juegos gratis</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="Open Game inicio">
      <span class="brand-mark">O</span>
      <span>open<span class="brand-green">game</span></span>
    </a>

    <label class="searchbox">
      <span class="search-icon">⌕</span>
      <input
        id="search"
        type="search"
        placeholder="Buscar juegos"
        autocomplete="off"
        aria-label="Buscar juegos"
      >
      <button id="clearSearch" aria-label="Borrar búsqueda" hidden>×</button>
    </label>
  </header>

  <main id="homeView">
    <section
      id="gameGrid"
      class="game-grid"
      aria-label="Juegos"
    ></section>

    <div id="emptyState" class="empty-state" hidden>
      No encontramos juegos con esa búsqueda.
    </div>

    <button id="loadMore" class="load-more">
      Ver más juegos
    </button>
  </main>

  <main id="playView" hidden>
    <div class="play-top">
      <a class="back-link" href="./">← Todos los juegos</a>
      <span id="gameTitle" class="play-title">Juego</span>
    </div>

    <section class="player-shell">
      <div class="player-tools">
        <span id="playerLabel">Open Game</span>

        <div class="tool-actions">
          <button
            id="smaller"
            title="Reducir tamaño"
            aria-label="Reducir tamaño"
          >−</button>

          <button
            id="bigger"
            title="Aumentar tamaño"
            aria-label="Aumentar tamaño"
          >+</button>

          <button
            id="fullscreen"
            title="Pantalla completa"
            aria-label="Pantalla completa"
          >⛶</button>
        </div>
      </div>

      <div id="playerFrameWrap" class="player-frame-wrap">
        <iframe
          id="gameFrame"
          title="Juego HTML5"
          allow="autoplay; fullscreen; gamepad; accelerometer; gyroscope; picture-in-picture"
          allowfullscreen
          referrerpolicy="strict-origin-when-cross-origin"
        ></iframe>
      </div>
    </section>
  </main>

  <footer class="footer">
    Open Game · Juegos HTML5
  </footer>

  <script src="games.js"></script>
  <script src="app.js"></script>
</body>
</html>
